[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-ai-womens-health-imaging"
version = "0.3.0"
description = "Colab-first research workflow for BreastMNIST ultrasound classification."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Noor Ul Ain Zahra"}]
license = {text = "MIT"}
dependencies = [
  "medmnist>=3.0.2",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "numpy>=1.24",
  "torch>=2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
